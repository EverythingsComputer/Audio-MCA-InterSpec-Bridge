# Build mcabridge bundles for Windows / macOS (arm64 + x86_64) / Linux and
# attach them to a GitHub Release.
#
# Triggers: pushing a tag like v0.2.0, or manually from the Actions tab
# (workflow_dispatch builds artifacts without publishing a release).
name: Build release bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create releases + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # older glibc for wider Linux compat
            label: linux-x86_64
          - os: macos-14              # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel        # Intel (macos-13 runners were retired 2025-12)
            label: macos-x86_64
          - os: windows-2022
            label: win64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install standalone build interpreter (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # IMPORTANT: do not build bundles with setup-python's hostedtoolcache
          # interpreter. Its PyInstaller launchers come up in onefile mode and
          # crash at startup ("Failed to load Python shared library /tmp/_MEI…",
          # shipped broken in v0.2.1–v0.2.5, fixed here). python-build-standalone
          # (the flavor Windows runners ship and the one verified working) is
          # used instead; the smoke test below re-proves it every release.
          PBS_REL=20261013
          PBS_VER=3.14.8
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)     PBS_TRIPLE=x86_64-unknown-linux-gnu ;;
            Darwin-arm64)     PBS_TRIPLE=aarch64-apple-darwin ;;
            Darwin-x86_64)    PBS_TRIPLE=x86_64-apple-darwin ;;
            *) echo "unsupported runner"; exit 1 ;;
          esac
          PBS_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_REL}/cpython-${PBS_VER}+${PBS_REL}-${PBS_TRIPLE}-install_only.tar.gz"
          echo "downloading $PBS_URL"
          curl -sSL "$PBS_URL" | tar xz -C "$HOME"
          "$HOME/python/bin/python3" -V

      - name: Install deps (Unix)
        if: runner.os != 'Windows'
        run: |
          $HOME/python/bin/python3 -m venv .venv-build
          .venv-build/bin/pip install --upgrade pip
          .venv-build/bin/pip install -e ".[gui,specutils]" pyinstaller

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # sandiaspecutils ships win_amd64 wheels for cp312 (abi3)
          pip install -e ".[gui,specutils]" pyinstaller

      - name: Bundle PortAudio libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          # build_release.sh copies .local/lib/*.so into the bundle so end
          # users need no libportaudio2. scripts/bundle_portaudio.sh fetches
          # them via apt-get download (no sudo needed).
          chmod +x scripts/bundle_portaudio.sh
          ./scripts/bundle_portaudio.sh
          ls -la .local/lib

      - name: Build bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/build_release.sh
          # PY must be the standalone-build venv (see interpreter step above);
          # hostedtoolcache python produces launchers that crash at startup.
          PY=$PWD/.venv-build/bin/python ./scripts/build_release.sh
          ls -la dist/

      - name: Build bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash   # git-bash ships on windows runners; one build path for all OSes
        run: |
          bash scripts/build_release.sh
          ls -la dist/

      - name: Smoke test built bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # The v0.2.1/v0.2.2 bundles shipped with launchers that crashed at
          # startup; never release without proving the binary runs.
          VER=$(python3 -c "import mcabridge; print(mcabridge.__version__)" 2>/dev/null || cat dist/.bundle_version 2>/dev/null)
          # macOS: build_release.sh moves _internal into mcabridge.app, so the
          # loose dist/mcabridge copy is stale there — always test the .app.
          if [ "$(uname -s)" = "Darwin" ]; then
            BIN="dist/mcabridge-$VER/mcabridge.app/Contents/MacOS/mcabridge"
          else
            BIN="dist/mcabridge-$VER/mcabridge"
          fi
          [ -f "$BIN" ] || { echo "::error::no built binary under dist/mcabridge-$VER"; ls -la dist/; exit 1; }
          if [ "$(uname -s)" = "Darwin" ]; then
            # v0.2.1–v0.2.9 shipped bundles with NO bundle signature; macOS
            # reported them as "damaged". Never release without the seal.
            APPDIR="dist/mcabridge-$VER/mcabridge.app"
            [ -f "$APPDIR/Contents/_CodeSignature/CodeResources" ] || \
              { echo "::error::macOS bundle unsigned (no _CodeSignature/CodeResources) — would be 'damaged' on macOS"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$APPDIR"
          fi
          echo "smoke-testing: $BIN"
          chmod +x "$BIN" || true
          if [ "$(uname -s)" = "Darwin" ]; then
            # GUI apps must NOT be background-only. EXE console=True makes
            # PyInstaller default LSBackgroundOnly=true, and LaunchServices
            # then never activates the app — double-click looks like an
            # instant hang. The spec overrides it to False; gate on that.
            if plutil -extract LSBackgroundOnly raw "$APPDIR/Contents/Info.plist" 2>/dev/null | grep -qi true; then
              echo "::error::macOS Info.plist has LSBackgroundOnly=true — app would launch invisibly (hang/crash report)"; exit 1
            fi
          fi
          { echo "== uname:"; uname -a
            echo "== python used for build:"; $PWD/.venv-build/bin/python -V
            echo "== pyinstaller:"; $PWD/.venv-build/bin/python -m PyInstaller --version
            echo "== ldd (missing?):"; ldd "$(dirname "$BIN")"/* 2>/dev/null | grep -i "not found" || true
          } > smoke_diag.txt 2>&1 || true
          set +e
          QT_QPA_PLATFORM=offscreen "$BIN" --gen-token > smoke_out.txt 2>&1
          rc=$?
          # GUI path smoke: build the whole window offscreen (the --gen-token
          # check is pure CLI; v0.2.x shipped GUI breakage this never saw).
          QT_QPA_PLATFORM=offscreen "$BIN" --self-test >> smoke_out.txt 2>&1
          rc2=$?
          set -e
          cat smoke_diag.txt >> smoke_out.txt
          echo "exit=$rc selftest=$rc2"; cat smoke_out.txt
          if ! grep -Eq '^[0-9a-f]{64}$' smoke_out.txt; then
            # surface the log publicly (artifacts need auth; annotations don't)
            python3 -c "import urllib.parse,sys; print('::error::SMOKE_LOG='+urllib.parse.quote(open('smoke_out.txt').read()))"
            exit 1
          fi
          if [ $rc2 -ne 0 ] || ! grep -q "self-test OK" smoke_out.txt; then
            python3 -c "import urllib.parse,sys; print('::error::GUI_SMOKE_FAILED rc='+str($rc2)+' SMOKE_LOG='+urllib.parse.quote(open('smoke_out.txt').read()))"
            exit 1
          fi

      - name: Smoke test built bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash   # git-bash, same find semantics as the Unix step
        run: |
          VER=$(python -c "import mcabridge; print(mcabridge.__version__)")
          BIN="dist/mcabridge-$VER/mcabridge.exe"
          [ -f "$BIN" ] || { echo "::error::no built binary at $BIN"; ls -la dist/; exit 1; }
          { echo "== python used for build:"; python -V 2>&1 || py -V 2>&1
            echo "== pyinstaller:"; python -m PyInstaller --version 2>&1
          } > smoke_diag.txt 2>&1 || true
          set +e
          "$BIN" --gen-token > smoke_out.txt 2>&1
          rc=$?
          QT_QPA_PLATFORM=offscreen "$BIN" --self-test >> smoke_out.txt 2>&1
          rc2=$?
          set -e
          cat smoke_diag.txt >> smoke_out.txt
          tr -d '\r' < smoke_out.txt > smoke_out_clean.txt || true
          echo "exit=$rc selftest=$rc2"; cat smoke_out_clean.txt
          if ! grep -Eq '^[0-9a-f]{64}$' smoke_out_clean.txt; then
            python3 -c "import urllib.parse,sys; print('::error::SMOKE_LOG='+urllib.parse.quote(open('smoke_out_clean.txt').read()))" \
              || python -c "import urllib.parse,sys; print('::error::SMOKE_LOG='+urllib.parse.quote(open('smoke_out_clean.txt').read()))"
            exit 1
          fi
          if [ $rc2 -ne 0 ] || ! grep -q "self-test OK" smoke_out_clean.txt; then
            python3 -c "import urllib.parse,sys; print('::error::GUI_SMOKE_FAILED rc='+str($rc2)+' SMOKE_LOG='+urllib.parse.quote(open('smoke_out_clean.txt').read()))" \
              || python -c "import urllib.parse,sys; print('::error::GUI_SMOKE_FAILED rc='+str($rc2)+' SMOKE_LOG='+urllib.parse.quote(open('smoke_out_clean.txt').read()))"
            exit 1
          fi

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-log-${{ matrix.label }}
          path: smoke_out.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: mcabridge-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: mcabridge-*
          merge-multiple: true
          path: assets

      - name: Show assets
        run: ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/mcabridge-linux-x86_64.tar.gz
            assets/mcabridge-macos-arm64.app.tar.gz
            assets/mcabridge-macos-x86_64.app.tar.gz
            assets/mcabridge-win64.zip
          generate_release_notes: true
          body: |
            Prebuilt mcabridge bundles. Each archive contains a single
            `mcabridge` executable: run with **no arguments** to open the GUI,
            or pass flags for headless CLI use (`--list`, `--wav FILE`, …).

            - **Windows**: unzip, run `mcabridge-*\mcabridge.exe`.
            - **macOS**: unpack, drag `mcabridge.app` to Applications. It is
              ad-hoc signed (not notarized): first launch via right-click →
              Open, or `xattr -dr com.apple.quarantine mcabridge.app`.
            - **Linux**: unpack, run `./mcabridge-*/mcabridge`
              (PortAudio + libjack are bundled; no system packages needed).

            Requires InterSpec 1.0.x with the MCP API enabled for live push —
            see README "Quick start".
